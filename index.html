<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="styles/style.css" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <script src="scripts/script.js" defer></script>
    <title>Suivis Esport</title>
</head>
<body>
	<header>
		<h1>Suivis Esport</h1>
		<small id="time"></small>
	</header>

	<section class="card">
		<h2>Counter</h2>
		<div>
			<button id="dec">-</button>
			<span id="count" style="margin:0 12px; font-weight:600">0</span>
			<button id="inc">+</button>
			<button id="reset" style="margin-left:12px">Reset</button>
		</div>
	</section>

	<section class="card">
		<h2>Todo</h2>
		<div>
			<input id="newTodo" type="text" placeholder="Add todo and press Enter" />
		</div>
		<ul id="todos"></ul>
	</section>

	<section class="card">
		<h2>Fetch Example</h2>
		<div>
			<button id="loadPosts">Load Sample Posts</button>
			<ul id="posts"></ul>
		</div>
	</section>
</body>
</html>
